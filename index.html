<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MagicBlock Quiz</title>

<style>
:root {
  --neon:#a855f7;
  --bg:#0b0615;
  --card:#140a26;
  --text:#e9d5ff;
  --good:#22c55e;
  --bad:#ef4444;
}

* { box-sizing:border-box; font-family:Inter,system-ui,sans-serif }

body {
  margin:0;
  background:radial-gradient(circle at top,#1e0b3a,var(--bg));
  color:var(--text);
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:20px;
}

.container {
  width:100%;
  max-width:820px;
  background:var(--card);
  border-radius:18px;
  padding:28px;
  box-shadow:0 0 40px rgba(168,85,247,.25);
}

h1 {
  text-align:center;
  color:var(--neon);
  text-shadow:0 0 14px var(--neon);
}

.subtitle {
  text-align:center;
  opacity:.8;
  margin-bottom:20px;
}

/* ===== PROGRESS ===== */
.progress-wrap { margin-bottom:30px }
.progress-text { text-align:right; font-size:14px; opacity:.8 }
.progress-bar {
  width:100%; height:14px;
  background:#0f0820;
  border-radius:999px;
  overflow:hidden;
  border:1px solid #2e1065;
}
.progress-fill {
  height:100%;
  width:0%;
  background:linear-gradient(90deg,#9333ea,#c084fc,#9333ea);
  box-shadow:0 0 18px rgba(168,85,247,.9);
  transition:width .35s ease;
}
/* ==================== */

input[type=text] {
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid #2e1065;
  background:#0f0820;
  color:white;
  font-size:16px;
  margin-bottom:25px;
}

.question { margin-bottom:28px }

.option {
  display:block;
  padding:12px 14px;
  border-radius:12px;
  background:#0f0820;
  border:1px solid #2e1065;
  margin-bottom:10px;
  cursor:pointer;
  transition:.2s;
}

.option.correct {
  border-color:var(--good);
  box-shadow:0 0 20px rgba(34,197,94,.8);
  animation:pulse .6s ease;
}
.option.wrong {
  border-color:var(--bad);
  box-shadow:0 0 20px rgba(239,68,68,.8);
  animation:shake .4s ease;
}

@keyframes pulse { 50%{transform:scale(1.03)} }
@keyframes shake {
  25%{transform:translateX(-4px)}
  50%{transform:translateX(4px)}
  75%{transform:translateX(-4px)}
}

button {
  width:100%;
  padding:16px;
  border-radius:14px;
  border:none;
  font-size:18px;
  cursor:pointer;
  background:linear-gradient(135deg,#9333ea,#c084fc);
  color:#140a26;
  font-weight:700;
  box-shadow:0 0 25px rgba(168,85,247,.6);
  margin-top:10px;
}

.result { display:none; text-align:center }

canvas {
  width:100%;
  margin-top:20px;
  border-radius:14px;
  box-shadow:0 0 30px rgba(168,85,247,.5);
}
</style>
</head>

<body>
<div class="container">

<h1>MagicBlock Quiz</h1>
<div class="subtitle">Test your MagicBlock knowledge</div>

<div class="progress-wrap">
  <div class="progress-text" id="progressText">Answered 0 / 10</div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
</div>

<input id="nickname" type="text" placeholder="Enter your nickname"
       inputmode="text" autocomplete="nickname">

<div id="quiz"></div>

<button id="finishBtn" onclick="finishQuiz()">Finish quiz</button>

<div class="result" id="result">
  <h2>🎉 Quiz completed</h2>
  <p id="scoreText"></p>
  <canvas id="certificate"></canvas>
  <button onclick="downloadCert()">Download certificate</button>
</div>

</div>

<script>
let quizFinished=false;
let certID="";

const questions = [
  {
    q: "What is the main goal of MagicBlock?",
    a: [
      "Creating NFT marketplaces",
      "Enabling real-time computation for on-chain applications",
      "Providing off-chain data storage",
      "Launching its own Layer-1 blockchain"
    ],
    c: 1
  },
  {
    q: "Which core MagicBlock product enables real-time games and applications?",
    a: [
      "Magic Wallet",
      "Ephemeral Rollups",
      "Static Validators",
      "Magic Oracle"
    ],
    c: 1
  },
  {
    q: "What makes Ephemeral Rollups different from traditional rollups?",
    a: [
      "They are fully off-chain",
      "They do not use smart contracts",
      "They are application-specific and can be temporary",
      "They are designed only for DeFi"
    ],
    c: 2
  },
  {
    q: "Which blockchain is MagicBlock initially built on?",
    a: [
      "Ethereum",
      "Solana",
      "Polygon",
      "Avalanche"
    ],
    c: 1
  },
  {
    q: "How does MagicBlock address latency issues in on-chain applications?",
    a: [
      "By increasing gas fees",
      "By using centralized servers",
      "By moving computation to Ephemeral Rollups with fast finality",
      "By removing consensus entirely"
    ],
    c: 2
  },
  {
    q: "How does MagicBlock ensure the security of its solutions?",
    a: [
      "Through closed-source code only",
      "By using a proprietary consensus mechanism",
      "By leveraging smart contract audits and the security of the base blockchain",
      "By fully relying on users"
    ],
    c: 2
  },
  {
    q: "Has MagicBlock undergone external security audits?",
    a: [
      "No, audits are not part of the roadmap",
      "Yes, the codebase and architecture have undergone independent audits",
      "Only internal reviews were conducted",
      "Audits are planned for the future"
    ],
    c: 1
  },
  {
    q: "How is pricing determined for MagicBlock products?",
    a: [
      "A fixed monthly subscription",
      "Completely free for all users",
      "Based on usage and product type",
      "Only through purchasing a token"
    ],
    c: 2
  },
  {
    q: "Where can developers check the current system status of MagicBlock?",
    a: [
      "Discord",
      "Twitter",
      "The System Status page",
      "The Whitepaper"
    ],
    c: 2
  },
  {
    q: "What is the purpose of the Request for Products (RFP) at MagicBlock?",
    a: [
      "Submitting investment proposals",
      "Requesting new features or products from the MagicBlock team",
      "Filing user complaints",
      "DAO governance voting"
    ],
    c: 1
  }
];


const quiz=document.getElementById("quiz");
const progressFill=document.getElementById("progressFill");
const progressText=document.getElementById("progressText");

questions.forEach((q,i)=>{
  quiz.innerHTML+=`
  <div class="question">
    <h3>${i+1}. ${q.q}</h3>
    ${q.a.map((o,idx)=>`
      <label class="option">
        <input type="radio" name="q${i}" value="${idx}" onchange="updateProgress()"> ${o}
      </label>`).join("")}
  </div>`;
});

function updateProgress(){
  if(quizFinished) return;
  let answered=0;
  questions.forEach((_,i)=>{
    if(document.querySelector(`input[name=q${i}]:checked`)) answered++;
  });
  progressFill.style.width=(answered/questions.length*100)+"%";
  progressText.innerText=`Answered ${answered} / ${questions.length}`;
}

function finishQuiz(){
  if(quizFinished) return;
  const nick=nickname.value.trim();
  if(!nick){ nickname.focus(); return alert("Enter nickname"); }

  quizFinished=true;
  finishBtn.disabled=true;

  let score=0;

  questions.forEach((q,i)=>{
    document.querySelectorAll(`input[name=q${i}]`).forEach(o=>{
      o.disabled=true;
      const label=o.parentElement;
      if(Number(o.value)===q.c) label.classList.add("correct");
      if(o.checked && Number(o.value)!==q.c) label.classList.add("wrong");
      if(o.checked && Number(o.value)===q.c) score++;
    });
  });

  scoreText.innerText=`Score: ${score} / 10`;
  result.style.display="block";
  generateCertificate(nick,score);
}

function generateCertificate(nick, score) {
  const canvas = document.getElementById("certificate");
  const ctx = canvas.getContext("2d");
  const img = new Image();

  // короткий ID (8 символов)
  const shortID = crypto.randomUUID().split("-")[0].toUpperCase();
  const date = new Date().toLocaleDateString();

  img.src = "images/certificate.png";

  img.onload = () => {
    canvas.width = img.width;
    canvas.height = img.height;

    ctx.drawImage(img, 0, 0);
    ctx.fillStyle = "#6b21a8";

    /* =========================
       1️⃣ NAME (над пунктиром)
    ========================= */
    ctx.textAlign = "center";
    ctx.font = "bold 58px Inter";
    ctx.fillText(
      nick,
      canvas.width / 2,
      515   // точка НАД пунктирной линией
    );

    /* =========================
       2️⃣ SCORE (X /10)
    ========================= */
    ctx.textAlign = "right";
    ctx.font = "bold 64px Inter";
    ctx.fillText(
      score,
      canvas.width - 250,
      1035
    );

    ctx.font = "36px Inter";
    ctx.fillText(
      "/10",
      canvas.width - 170,
      1035
    );

    /* =========================
       3️⃣ CERT ID + DATE
    ========================= */
    ctx.textAlign = "left";
    ctx.font = "26px monospace";
    ctx.fillText(
      `${shortID} • ${date}`,
      390,   // сразу после "Certificate ID:"
      1035
    );
  };
}



function downloadCert(){
  const a=document.createElement("a");
  a.download=`magicblock_certificate_${certID}.png`;
  a.href=certificate.toDataURL("image/png");
  a.click();
}

// mobile keyboard fix
window.addEventListener("load",()=>{
  setTimeout(()=>nickname.focus(),300);
});
</script>

</body>
</html>
